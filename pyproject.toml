[project]
name = "openband"
version = "0.1.0"
description = "Read your Huawei Band 6 over Bluetooth LE without Huawei Health or a Huawei account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "fport" }]
dependencies = [
    "bleak>=0.22",
    "cryptography>=42",
]

[project.scripts]
openband = "openband.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openband"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
