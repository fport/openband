name: Openband
options:
  bundleIdPrefix: dev.fport
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${OPENBAND_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Openband:
    type: application
    platform: iOS
    sources:
      - path: Openband
        excludes:
          - "**/*.old"
    info:
      path: Openband/Info.plist
      properties:
        CFBundleDisplayName: Openband
        UIAppFonts: [OpenSauceSans-Regular.otf, OpenSauceSans-Medium.otf, OpenSauceSans-SemiBold.otf]
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Openband uses Bluetooth to talk directly to the band on your wrist.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [bluetooth-le]
        CFBundleURLTypes:
          - CFBundleURLName: dev.fport.openband
            CFBundleURLSchemes: [openband]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fport.openband
        PRODUCT_NAME: Openband
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
