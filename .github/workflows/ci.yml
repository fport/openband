name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol port (Gadgetbridge vectors, fake band)
        working-directory: ios/tests/protocol
        run: swiftc ../../Openband/Band/Huawei/*.swift FakeBand.swift main.swift -o hwproto && ./hwproto
      - name: Scores (Freeband analytics)
        working-directory: ios/tests/analytics
        run: swiftc ../../Openband/Analytics/*.swift main.swift -o analytics && ./analytics

      - name: Workouts (route geometry, splits, pace)
        working-directory: ios/tests/workouts
        run: swiftc ../../Openband/Workouts/RouteGeometry.swift ../../Openband/Workouts/Splits.swift ../../Openband/Workouts/Sport.swift main.swift -o workouts && ./workouts

      - name: Health library (markdown parser, both languages complete)
        working-directory: ios/tests/knowledge
        run: swiftc ../../Openband/Knowledge/*.swift main.swift -o knowledge && ./knowledge

      - name: Design tokens are in step with design/tokens.json
        run: |
          python3 -I scripts/gen_tokens.py
          git diff --exit-code ios/Openband/UI/Design/Tokens.generated.swift
